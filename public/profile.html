<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioTrack | User & Lab Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-bio-grid bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

  <!-- Shared Header -->
  <div id="header-root"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    
    <!-- Profile Banner -->
    <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden">
      <div class="h-36 bg-gradient-to-r from-emerald-950 via-slate-900 to-green-950 relative"></div>
      
      <div class="px-6 sm:px-8 pb-6 relative flex flex-col md:flex-row items-start md:items-end justify-between gap-6 -mt-14">
        <div class="flex flex-col sm:flex-row items-start sm:items-end gap-5">
          <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-emerald-600 to-green-400 text-white flex items-center justify-center font-black text-3xl border-4 border-white shadow-xl">
            SR
          </div>
          <div class="space-y-1">
            <h1 class="text-2xl font-extrabold text-slate-900">Dr. Sarah Raman, PhD</h1>
            <p class="text-xs text-slate-600">Principal Investigator • <span class="text-emerald-700 font-bold">GenVault Therapeutics</span></p>
          </div>
        </div>

        <a href="publish.html" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-green-600 text-white rounded-xl text-xs font-bold shadow-md">
          + Start New Protocol
        </a>
      </div>
    </div>

    <!-- Managed Studies -->
    <div class="bg-white rounded-3xl border border-slate-200/80 p-6 space-y-4">
      <h2 class="text-lg font-bold text-slate-900">Managed Protocols</h2>
      <div class="interactive-card p-5 rounded-2xl border border-slate-200 bg-slate-50 flex items-center justify-between">
        <div>
          <span class="font-bold text-slate-900 block text-sm">Project BT-402 (Targeted mRNA Delivery)</span>
          <span class="text-xs text-slate-500">Status: Phase II Clinical • $32,500 Crowdfunded</span>
        </div>
        <a href="study-detail.html" class="px-3.5 py-2 bg-white border border-slate-300 rounded-xl text-xs font-bold text-slate-700">
          Manage RBAC & Protocol →
        </a>
      </div>
    </div>

  </main>

  <footer class="bg-slate-950 border-t border-emerald-900/40 text-slate-400 text-xs py-6 mt-12 text-center">
    <p>© 2026 BioTrack Platform • User Profile</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('header-root').innerHTML = renderHeader('profile');
  </script>
</body>
</html>
