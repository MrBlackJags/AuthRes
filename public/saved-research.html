<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthRos | My Saved Research & Bookmarked Publications</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            popover: {
              DEFAULT: 'hsl(var(--popover))',
              foreground: 'hsl(var(--popover-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          }
        }
      }
    };
    if (localStorage.getItem('authros_theme') === 'dark' || localStorage.getItem('biotrack_theme') === 'dark' || (!('authros_theme' in localStorage) && !('biotrack_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-background text-foreground font-sans antialiased min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white transition-colors duration-200">

  <!-- Shared Header -->
  <div id="header-root"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    
    <!-- Top Hero Banner (Forest Green + Sunset Orange Research Theme) -->
    <div class="reveal bg-research-hero text-white p-6 sm:p-8 rounded-3xl border border-orange-500/25 shadow-xl relative overflow-hidden">
      <div class="absolute top-0 right-0 w-80 h-80 bg-orange-500/15 rounded-full blur-3xl pointer-events-none"></div>
      <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="inline-flex items-center gap-2 bg-orange-500/20 border border-orange-400/30 text-orange-300 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider mb-2">
            <i class="fa-solid fa-bookmark text-orange-400"></i> Personal Research Library
          </div>
          <h1 class="text-2xl sm:text-4xl font-extrabold text-gradient-research tracking-tight">My Saved Studies & Bookmarks</h1>
          <p class="text-xs sm:text-sm text-slate-300 mt-1 max-w-2xl">
            Access your saved medical research papers, appreciated publications, and reading list across devices.
          </p>
        </div>
        
        <div class="flex items-center gap-2 flex-wrap">
          <button onclick="exportSavedCitations()" class="btn-forest font-bold px-4 py-2.5 rounded-xl text-xs border border-white/20 transition flex items-center gap-1.5 shadow-2xs">
            <i class="fa-solid fa-download"></i> Export APA Citations
          </button>
          <a href="research.html" class="btn-sunset font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-md shrink-0 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-plus"></i> Browse Directory
          </a>
        </div>
      </div>
    </div>

    <!-- Filter Tabs Bar -->
    <div class="reveal bg-card p-4 rounded-3xl border border-border shadow-xs flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 bg-muted p-1 rounded-2xl border border-border text-xs font-semibold">
        <button onclick="filterSaved('all', this)" id="tab-all" class="saved-tab-btn px-4 py-2 rounded-xl transition flex items-center gap-2 bg-emerald-600 text-white shadow-xs font-bold">
          <i class="fa-solid fa-layer-group"></i> All Saved Items
          <span class="bg-white/20 px-2 py-0.5 rounded-full text-[10px]" id="count-all">0</span>
        </button>

        <button onclick="filterSaved('bookmarked', this)" id="tab-bookmarked" class="saved-tab-btn px-4 py-2 rounded-xl transition flex items-center gap-2 text-muted-foreground hover:text-foreground">
          <i class="fa-solid fa-bookmark text-emerald-600"></i> Bookmarked (<span id="count-bookmarked">0</span>)
        </button>

        <button onclick="filterSaved('liked', this)" id="tab-liked" class="saved-tab-btn px-4 py-2 rounded-xl transition flex items-center gap-2 text-muted-foreground hover:text-foreground">
          <i class="fa-solid fa-heart text-rose-500"></i> Liked Studies (<span id="count-liked">0</span>)
        </button>
      </div>

      <button onclick="clearAllSaved()" class="text-xs text-rose-600 font-bold hover:underline flex items-center gap-1">
        <i class="fa-solid fa-trash-can"></i> Clear Saved Library
      </button>
    </div>

    <!-- Cards Container -->
    <div id="savedContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Loaded dynamically -->
    </div>

  </main>

  <!-- Shared Footer -->
  <footer class="bg-slate-950 border-t border-emerald-900/40 text-slate-400 text-xs py-8 mt-12 text-center">
    <div class="max-w-7xl mx-auto px-4 space-y-2">
      <div class="flex items-center justify-center gap-2 text-white font-bold text-sm">
        <i class="fa-solid fa-dna text-emerald-400"></i> AuthRos Saved Research Library
      </div>
      <p>© 2026 AuthRos • Centralized Biomedical Research Protocol Archive</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    let savedFilter = 'all';

    function initSavedPage() {
      document.getElementById('header-root').innerHTML = renderHeader('saved');
      renderSavedCards();
    }

    function getAllLibraryProjects() {
      return (typeof AuthRosData !== 'undefined') ? AuthRosData.getPapers() : [];
    }

    function renderSavedCards() {
      const container = document.getElementById('savedContainer');
      const bookmarks = AuthRosState.getBookmarks();
      const likes = AuthRosState.getLikes();
      const library = getAllLibraryProjects();

      // Filter items
      const savedItems = library.filter(p => {
        const isB = AuthRosState.isBookmarked(p.id);
        const isL = AuthRosState.isLiked(p.id);
        if (savedFilter === 'bookmarked') return isB;
        if (savedFilter === 'liked') return isL;
        return isB || isL;
      });

      const totalUnique = library.filter(p => AuthRosState.isBookmarked(p.id) || AuthRosState.isLiked(p.id)).length;
      document.getElementById('count-all').textContent = totalUnique;
      document.getElementById('count-bookmarked').textContent = bookmarks.length;
      document.getElementById('count-liked').textContent = likes.length;

      if (savedItems.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-card p-12 rounded-3xl border border-border text-center space-y-4 shadow-xs">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center mx-auto text-2xl font-bold">
              <i class="fa-regular fa-bookmark"></i>
            </div>
            <div class="space-y-1">
              <h3 class="font-extrabold text-foreground text-lg">Your saved research library is empty</h3>
              <p class="text-xs text-muted-foreground max-w-sm mx-auto">Explore the research directory and click the bookmark or heart buttons on studies to save them here.</p>
            </div>
            <a href="research.html" class="inline-block px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-xs transition">
              Browse Research Directory →
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = savedItems.map(p => {
        const isB = AuthRosState.isBookmarked(p.id);
        const isL = AuthRosState.isLiked(p.id);
        const flagSvg = (typeof getCountryFlagSvg === 'function') ? getCountryFlagSvg(p.country_code) : '';

        return `
          <div class="shadcn-card p-6 flex flex-col justify-between space-y-5 border-border hover:border-emerald-500/50 hover:shadow-lg transition-all duration-300 relative overflow-hidden group">
            
            <div class="space-y-3">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="shadcn-badge ${p.status === 'completed' ? 'badge-emerald' : 'badge-amber'} text-[10px] uppercase font-bold tracking-wider">
                    ${p.status === 'completed' ? 'COMPLETED PUBLICATION' : 'ACTIVE PIPELINE'}
                  </span>
                  <span class="inline-flex items-center gap-1 bg-muted px-2 py-0.5 rounded-md border border-border text-[10px] text-foreground font-semibold">
                    ${flagSvg}
                    <span>${p.country_code || 'GL'}</span>
                  </span>
                </div>

                <div class="flex items-center gap-1">
                  <button onclick="toggleBookmarkInSaved('${p.id}')" title="Remove Bookmark" class="p-1.5 rounded-lg text-emerald-600 hover:text-rose-600 transition">
                    <i class="${isB ? 'fa-solid' : 'fa-regular'} fa-bookmark text-xs"></i>
                  </button>
                  <span class="font-mono text-[11px] text-muted-foreground font-bold">${p.code}</span>
                </div>
              </div>

              <div>
                <a href="study-detail.html?id=${p.id}" class="text-base font-extrabold text-foreground group-hover:text-emerald-600 transition leading-snug line-clamp-2 block">
                  ${p.title}
                </a>
                <p class="text-xs text-muted-foreground mt-2 line-clamp-2 leading-relaxed">
                  ${p.abstract || p.summary}
                </p>
                <div class="mt-2 text-xs text-muted-foreground flex items-center gap-1.5">
                  <i class="fa-solid fa-user-doctor text-emerald-600 text-[11px]"></i>
                  <span class="font-semibold text-foreground">${p.lead_name || 'Research Lead'}</span>
                  <span>•</span>
                  <span>${p.journal_citation || 'Peer-Reviewed'}</span>
                </div>
              </div>
            </div>

            <div class="pt-3 border-t border-border flex items-center justify-between text-xs gap-2">
              <div class="flex items-center gap-1.5">
                <button onclick="openQuickViewModal('${p.id}')" title="Quick View Abstract" class="shadcn-btn btn-outline btn-sm text-xs py-1 px-2.5 hover:border-emerald-500 hover:text-emerald-600 transition">
                  <i class="fa-regular fa-eye mr-1 text-emerald-600"></i> Quick View
                </button>
                <button onclick="openShareModal('${escapeQuotes(p.title)}', '${p.code}', '${p.doi || ''}', '${escapeQuotes(p.journal_citation || '')}', '${p.source_url || ''}')" title="Cite Study" class="shadcn-btn btn-ghost btn-sm text-xs py-1 px-2">
                  <i class="fa-solid fa-quote-left"></i>
                </button>
              </div>

              <a href="study-detail.html?id=${p.id}" class="shadcn-btn btn-default btn-sm text-xs py-1.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold">
                Inspect Protocol →
              </a>
            </div>

          </div>
        `;
      }).join('');
    }

    function toggleBookmarkInSaved(id) {
      AuthRosState.toggleBookmark(id);
      renderSavedCards();
      showToast('Saved research library synchronized.', 'Library Updated', 'info');
    }

    function filterSaved(type, btn) {
      savedFilter = type;
      document.querySelectorAll('.saved-tab-btn').forEach(b => {
        b.className = 'saved-tab-btn px-4 py-2 rounded-xl transition flex items-center gap-2 text-muted-foreground hover:text-foreground';
      });
      btn.className = 'saved-tab-btn px-4 py-2 rounded-xl transition flex items-center gap-2 bg-emerald-600 text-white shadow-xs font-bold';
      renderSavedCards();
    }

    function clearAllSaved() {
      if (confirm('Are you sure you want to clear your saved research items?')) {
        localStorage.setItem('authros_saved', '[]');
        localStorage.setItem('authros_liked', '[]');
        localStorage.setItem('biotrack_bookmarks', '[]');
        localStorage.setItem('biotrack_likes', '[]');
        renderSavedCards();
        showToast('Your saved research library has been cleared.', 'Library Cleared', 'info');
      }
    }

    function exportSavedCitations() {
      const bookmarks = AuthRosState.getBookmarks();
      const library = getAllLibraryProjects().filter(p => bookmarks.includes(p.id));
      if (library.length === 0) {
        showToast('No bookmarked studies to export. Bookmark a study first!', 'Export Empty', 'amber');
        return;
      }

      const text = library.map(p => `[${p.code}] ${p.title}.\n  Journal: ${p.journal_citation}\n  DOI: ${p.doi || 'N/A'}\n  URL: ${p.source_url || 'https://authros.org'}\n`).join('\n---\n\n');
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Exported ${library.length} publication citations to your clipboard!`, 'Citations Exported', 'success');
      });
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', initSavedPage);
  </script>
</body>
</html>
