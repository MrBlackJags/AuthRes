<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthRos | The Open Biomedical Research & Protocol Infrastructure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js for 3D Interactive Multi-Model Molecular Simulation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            popover: {
              DEFAULT: 'hsl(var(--popover))',
              foreground: 'hsl(var(--popover-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          }
        }
      }
    };
    if (localStorage.getItem('authros_theme') === 'dark' || (!('authros_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/interactive.css" />
  <style>
    /* Full-screen 3D DNA Backdrop filling screen with 15% lowered visibility (opacity: 0.85) */
    #bg-dna-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      opacity: 0.85; /* Lower visibility by 15% */
      pointer-events: auto;
      cursor: grab;
      filter: drop-shadow(0 0 35px rgba(16, 185, 129, 0.22));
    }
    #bg-dna-backdrop:active {
      cursor: grabbing;
    }

    /* Toolbar & Actions initial 2-second isolation state */
    #header-root,
    #landing-actions {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(-8px);
      position: relative;
      z-index: 50;
    }
    #landing-actions {
      transform: translateY(8px);
      z-index: 20;
    }
    #header-root.toolbar-revealed,
    #landing-actions.actions-revealed {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-background text-foreground font-sans antialiased min-h-screen h-full flex flex-col justify-between selection:bg-emerald-500 selection:text-white transition-colors duration-200 overflow-hidden relative">

  <!-- Massive Full-Screen 3D DNA Double Helix Backdrop (Opacity 0.85) -->
  <canvas id="bg-dna-backdrop" data-bio-3d="dna-backdrop"></canvas>

  <!-- Shared Header Navigation (Isolated for first 2 seconds, fades in smoothly) -->
  <div id="header-root"></div>

  <!-- Pure Isolated Hero: AuthRos Centered -->
  <main class="flex-1 flex flex-col items-center justify-center text-center select-none px-4 sm:px-6 relative z-10 w-full">
    <div class="space-y-4 sm:space-y-5">
      <h1 class="text-7xl sm:text-8xl md:text-9xl lg:text-[11rem] xl:text-[13rem] font-black tracking-tighter text-foreground leading-none font-brand drop-shadow-2xl select-none transition-transform duration-500 hover:scale-[1.02]">
        Auth<span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-500">Ros</span>
      </h1>
      <p class="text-xs sm:text-sm md:text-base font-serif text-muted-foreground max-w-md mx-auto italic tracking-wide">
        The Open Biomedical Research & Protocol Infrastructure
      </p>

      <!-- Action Buttons: 3 Small Domain Buttons (Logged In) OR Login & Register (Logged Out) -->
      <div id="landing-actions" class="pt-2 flex items-center justify-center gap-2.5 sm:gap-3 flex-wrap"></div>
    </div>
  </main>

  <!-- Empty bottom spacer to maintain centered harmony -->
  <div class="h-10 w-full pointer-events-none"></div>

  <script src="js/app.js"></script>
  <script>
    // Initialize header navigation
    const headerEl = document.getElementById('header-root');
    const actionsEl = document.getElementById('landing-actions');

    if (headerEl) {
      headerEl.innerHTML = renderHeader('home');
    }

    // Render landing action buttons based on authentication state
    function renderLandingActions() {
      if (!actionsEl) return;
      const isAuth = typeof AuthManager !== 'undefined' && AuthManager.isAuthenticated();

      if (isAuth) {
        // Logged in: show the 3 domains it can go through below (small buttons)
        actionsEl.innerHTML = `
          <a href="researcher-portal.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-orange-500/35 hover:border-orange-500 bg-card/80 hover:bg-orange-500/10 text-foreground text-xs font-semibold shadow-xs backdrop-blur-md transition-all hover:scale-105 group" title="Researcher & Institutional Lab Domain">
            <i class="fa-solid fa-microscope text-[11px] text-orange-500 group-hover:scale-110 transition-transform"></i>
            <span>Researcher Portal</span>
          </a>
          <a href="hospital-portal.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-purple-500/35 hover:border-purple-500 bg-card/80 hover:bg-purple-500/10 text-foreground text-xs font-semibold shadow-xs backdrop-blur-md transition-all hover:scale-105 group" title="Hospital & Clinical Partner Domain">
            <i class="fa-solid fa-hospital text-[11px] text-purple-500 group-hover:scale-110 transition-transform"></i>
            <span>Hospital Portal</span>
          </a>
          <a href="public-portal.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-emerald-500/35 hover:border-emerald-500 bg-card/80 hover:bg-emerald-500/10 text-foreground text-xs font-semibold shadow-xs backdrop-blur-md transition-all hover:scale-105 group" title="Public Donor & Crowdfunding Domain">
            <i class="fa-solid fa-heart text-[11px] text-emerald-500 group-hover:scale-110 transition-transform"></i>
            <span>Public Portal</span>
          </a>
        `;
      } else {
        // Not logged in: give 2 buttons login or register (small buttons)
        actionsEl.innerHTML = `
          <a href="auth.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-border/80 bg-card/80 hover:bg-accent text-foreground text-xs font-semibold shadow-xs backdrop-blur-md transition-all hover:scale-105 hover:border-emerald-500/40" title="Sign In to your Account">
            <i class="fa-solid fa-arrow-right-to-bracket text-[11px] text-muted-foreground"></i>
            <span>Login</span>
          </a>
          <a href="auth.html?tab=register" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs transition-all hover:scale-105 shadow-emerald-900/20" title="Create a New Account">
            <i class="fa-solid fa-user-plus text-[11px]"></i>
            <span>Register</span>
          </a>
        `;
      }
    }

    renderLandingActions();

    // Listen for cross-tab or logout auth changes
    window.addEventListener('storage', (e) => {
      if (e.key === 'authros_token' || e.key === 'authros_user') {
        renderLandingActions();
        if (headerEl) headerEl.innerHTML = renderHeader('home');
      }
    });

    // 2-Second Isolation Timer:
    // Only "AuthRos" and the backdrop DNA are visible for the first 2 seconds.
    // After 2.0s, the header toolbar & actions reveal seamlessly.
    function revealUI() {
      if (headerEl) headerEl.classList.add('toolbar-revealed');
      if (actionsEl) actionsEl.classList.add('actions-revealed');
    }

    const revealTimer = setTimeout(revealUI, 2000);

    // Allow instant reveal on interaction if user doesn't want to wait
    window.addEventListener('click', () => { clearTimeout(revealTimer); revealUI(); }, { once: true });
    window.addEventListener('keydown', () => { clearTimeout(revealTimer); revealUI(); }, { once: true });
    window.addEventListener('touchstart', () => { clearTimeout(revealTimer); revealUI(); }, { once: true });
  </script>
</body>
</html>
