<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioTrack | Sign In / Register Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gradient-to-br from-emerald-950 via-slate-900 to-emerald-900 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <!-- Container Box -->
  <div class="bg-white rounded-3xl border border-emerald-500/20 shadow-2xl max-w-4xl w-full overflow-hidden grid lg:grid-cols-12 relative z-10">
    
    <!-- Left Hero Column -->
    <div class="lg:col-span-5 bg-gradient-to-br from-emerald-950 via-slate-900 to-emerald-900 text-white p-8 lg:p-10 flex flex-col justify-between hidden lg:flex border-r border-emerald-500/20">
      <div class="space-y-6">
        <a href="index.html" class="inline-flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-green-400 text-slate-950 flex items-center justify-center font-bold text-lg shadow-md">
            <i class="fa-solid fa-dna"></i>
          </div>
          <span class="font-extrabold text-2xl tracking-tight text-white">
            Bio<span class="text-emerald-400">Track</span>
          </span>
        </a>

        <div class="space-y-3">
          <h2 class="text-2xl font-extrabold text-gradient-hero leading-tight">
            Unified Ecosystem Authentication
          </h2>
          <p class="text-xs text-slate-300">
            Connecting Public Donors, Hospital Clinical Partners, and Institutional Researchers.
          </p>
        </div>
      </div>
    </div>

    <!-- Right Form Column -->
    <div class="lg:col-span-7 p-6 sm:p-10 space-y-6 bg-white flex flex-col justify-center">
      <div class="text-center lg:text-left space-y-1">
        <h3 class="text-2xl font-extrabold text-slate-900">Sign In to BioTrack</h3>
        <p class="text-xs text-slate-500">Access your role-based dashboard & protocols.</p>
      </div>

      <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Work / Institutional Email</label>
          <input type="email" id="login-email" required value="dr.raman@genvault.org" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-emerald-500 text-sm bg-slate-50" />
        </div>

        <div>
          <label class="block font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <input type="password" required value="••••••••" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-emerald-500 text-sm bg-slate-50" />
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white rounded-xl font-bold text-sm shadow-md transition">
          Sign In to BioTrack →
        </button>
      </form>

      <div class="text-center pt-2">
        <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-slate-600">← Return to Home Page</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function handleLogin() {
      showToast('Authenticated successfully! Redirecting...', 'Success', 'success');
      setTimeout(() => { window.location.href = 'profile.html'; }, 1000);
    }
  </script>
</body>
</html>
